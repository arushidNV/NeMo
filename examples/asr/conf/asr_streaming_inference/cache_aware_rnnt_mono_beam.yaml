# Mono (en-US) cache-aware RNNT streaming profile, MALSD batched beam search decoding.
defaults:
  - cache_aware_rnnt
  - _self_

asr:
  model_name: /mnt/cifs/home/riva_speech/model_files/asr/cache-aware-parakeet-rnnt/en-US/nemotron_realtime_0.6b_riva.nemo
  decoding:
    strategy: "malsd_batch"
